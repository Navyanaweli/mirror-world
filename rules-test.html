<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules Test</title>
<style>
  :root { --bg: #11141C; --panel: #1A1F2B; --text: #EAE4D6; --dim: #8C93A3; --silver: #9FD6E0; --warm: #E9B872; --bad: #E07A72; --good: #8FD19E; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button, input { background: var(--panel); color: var(--text); border: 1px solid #333A4A; border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  input { min-width: 280px; }
  pre { background: var(--panel); padding: 12px 16px; border-radius: 8px; font: 22px/1.25 ui-monospace, Consolas, monospace; letter-spacing: 2px; margin: 0 0 12px; overflow-x: auto; }
  .t { color: var(--warm); font-weight: 700; } .o { color: var(--silver); font-weight: 700; }
  .info { color: var(--dim); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .pass { color: var(--good); } .fail { color: var(--bad); }
  #results { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
<h1>Aaina: rules test (no graphics)</h1>
<div class="row">
  <select id="pick"></select>
  <span class="info">Arrows/WASD move · Z undo · R restart · <span class="t">T</span> Theo · <span class="o">O</span> other</span>
</div>
<pre id="board"></pre>
<div id="info" class="info"></div>
<div class="row" style="margin-top:12px">
  <input id="keys" placeholder="Replay keys, e.g. L L D R">
  <button id="replay">Replay</button>
  <button id="checkAll">Check all levels</button>
</div>
<div id="results"></div>

<script src="src/levels.js"></script>
<script src="src/levels/level01.js"></script>
<script src="src/levels/level02.js"></script>
<script src="src/levels/level03.js"></script>
<script src="src/levels/level04.js"></script>
<script src="src/levels/level05.js"></script>
<script src="src/levels/level06.js"></script>
<script src="src/levels/level07.js"></script>
<script src="src/levels/level08.js"></script>
<script src="src/levels/level09.js"></script>
<script src="src/levels/level10.js"></script>
<script src="src/levels/level11.js"></script>
<script src="src/levels/level12.js"></script>
<script src="src/rules.js"></script>
<script>
  const levels = LEVELS.slice().sort((a, b) => a.number - b.number);
  const pick = document.getElementById("pick");
  levels.forEach((L, i) => { const o = document.createElement("option"); o.value = i; o.textContent = L.number + " · " + L.name; pick.appendChild(o); });
  let level = levels[0], state = Rules.load(level), lastEvents = state.startEvents;

  function draw() {
    const out = [];
    level.map.forEach((row, y) => {
      const halves = row.split("|");
      const line = halves.map((h, si) => {
        const side = si === 0 ? "left" : "right";
        return [...h].map((c, x) => {
          if (state.theo.side === side && state.theo.x === x && state.theo.y === y) return '<span class="t">T</span>';
          if (state.other.side === side && state.other.x === x && state.other.y === y) return '<span class="o">O</span>';
          if (c === "T" || c === "O") return ".";
          if (c === "%" && state.usedCracks.indexOf(side + ":" + x + ":" + y) !== -1) return ".";
          if ((c === "A" || c === "B") && state.openDoors.indexOf(c) !== -1) return "/";
          return c;
        }).join("");
      }).join("|");
      out.push(line);
    });
    document.getElementById("board").innerHTML = out.join("\n");
    document.getElementById("info").textContent =
      "turn " + state.turn + " · status " + state.status + (state.ending ? " · ending " + state.ending : "") +
      " · open doors [" + state.openDoors.join(",") + "] · used cracks " + state.usedCracks.length +
      "\nlast events: " + JSON.stringify(lastEvents);
  }

  function send(input) { const r = Rules.step(state, input); state = r.state; lastEvents = r.events; draw(); }

  pick.addEventListener("change", () => { level = levels[+pick.value]; state = Rules.load(level); lastEvents = state.startEvents; draw(); pick.blur(); });

  const keyMap = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", w: "U", s: "D", a: "L", d: "R", z: "UNDO", r: "RESTART" };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (k) { e.preventDefault(); send(k); }
  });

  function play(L, keys) {
    let s = Rules.load(L);
    for (const k of keys.trim().split(/\s+/)) { s = Rules.step(s, k).state; if (s.status !== "playing") break; }
    return s;
  }

  document.getElementById("replay").addEventListener("click", () => {
    state = play(level, document.getElementById("keys").value); lastEvents = []; draw();
  });

  document.getElementById("checkAll").addEventListener("click", () => {
    const lines = [];
    levels.forEach(L => {
      const sols = L.final ? L.solutions : { win: L.solution };
      Object.keys(sols || {}).forEach(goal => {
        const s = play(L, sols[goal]);
        const got = s.ending || (s.status === "won" ? "win" : s.status);
        const ok = got === goal;
        lines.push('<span class="' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS" : "FAIL") + "</span>  Level " + L.number + " " + goal + " (" + sols[goal].split(" ").length + " moves) → " + got);
      });
    });
    document.getElementById("results").innerHTML = lines.join("\n");
  });

  draw();
</script>
</body>
</html>
